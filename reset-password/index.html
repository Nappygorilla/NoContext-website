<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070809"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/mobile.css"><title>Set New Password | NoContext</title></head><body><main class="auth-page"><section class="auth-card"><div class="auth-brand"><div class="icon">NC</div><h1>Choose a new password</h1><p>Use a strong password with at least 12 characters.</p></div><form id="reset-form" class="auth-form"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><button class="btn btn-primary auth-submit" type="submit">Update password</button><p class="auth-status" id="status" role="status" aria-live="polite"></p></form><p class="auth-switch"><a href="../login.html">Back to sign in</a></p></section></main><script>window.NO_CONTEXT_API_URL='https://nocontext.onrender.com';</script><script src="../assets/js/pwa.js"></script><script>const f=document.getElementById('reset-form'),s=document.getElementById('status'),b=f.querySelector('button'),token=new URLSearchParams(location.search).get('token')||'';f.addEventListener('submit',async e=>{e.preventDefault();if(!f.checkValidity())return f.reportValidity();if(!token)return s.textContent='This reset link is missing its token.';if(password.value!==confirm.value)return s.textContent='Passwords do not match.';b.disabled=true;b.textContent='Updating…';s.textContent='';try{const r=await fetch(`${window.NO_CONTEXT_API_URL}/api/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Unable to update password.');s.textContent=d.message||'Password updated. Please sign in.';s.dataset.kind='success';f.reset();setTimeout(()=>location.href='../login.html',1200);}catch(err){s.textContent=err.message||'Unable to update password.';}finally{b.disabled=false;b.textContent='Update password';}});</script></body></html>
