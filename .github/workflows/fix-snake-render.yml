name: Fix Snake Rendering

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/js/product-preview.js'
      - 'assets/js/snake-render-fix.js'
      - '.github/workflows/fix-snake-render.yml'

permissions:
  contents: write

jobs:
  fix-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch Snake renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/product-preview.js')
          s = p.read_text()
          old = "#nc-snake-card canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:620px;image-rendering:auto;touch-action:none}"
          new = "#nc-snake-card canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:620px;image-rendering:auto;touch-action:none;background:#090c0d;box-shadow:inset 0 0 0 2px rgba(184,255,61,.35)}"
          if old in s:
              s = s.replace(old, new, 1)

          old = "ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;"
          new = "ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=1;"
          if old in s:
              s = s.replace(old, new, 1)

          old = "for(let i=1;i<SIZE;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke()}"
          new = "for(let i=1;i<SIZE;i++){ctx.beginPath();ctx.moveTo(i*CELL+.5,0);ctx.lineTo(i*CELL+.5,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL+.5);ctx.lineTo(canvas.width,i*CELL+.5);ctx.stroke()}ctx.strokeStyle='rgba(184,255,61,.5)';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,canvas.width-3,canvas.height-3)"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Add stable sprite/grid safeguard
        run: |
          cat > assets/js/snake-render-fix.js <<'EOF'
          (() => {
            const install = () => {
              const card = document.getElementById('nc-snake-card');
              const canvas = document.getElementById('snakeCanvas');
              if (!card || !canvas || card.dataset.renderFixInstalled) return;
              card.dataset.renderFixInstalled = '1';

              const wrap = card.querySelector('.snake-wrap');
              if (wrap) {
                wrap.style.background = '#090c0d';
                wrap.style.boxShadow = 'inset 0 0 0 2px rgba(184,255,61,.25)';
              }

              // Keep the board boundary obvious after entering fullscreen.
              const syncFullscreen = () => {
                const full = document.fullscreenElement === card || document.fullscreenElement === wrap;
                card.classList.toggle('snake-fullscreen', full);
              };
              document.addEventListener('fullscreenchange', syncFullscreen);
              syncFullscreen();
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, {once:true});
            else install();
            new MutationObserver(install).observe(document.documentElement, {childList:true, subtree:true});
          })();
          EOF

      - name: Load safeguard from main.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/main.js')
          s = p.read_text()
          marker = "assets/js/snake-render-fix.js"
          if marker not in s:
              s += "\n\nif(document.querySelector('.games-page')){const s=document.createElement('script');s.src='assets/js/snake-render-fix.js';s.defer=true;document.body.appendChild(s);}\n"
              p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/product-preview.js assets/js/snake-render-fix.js assets/js/main.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Snake turning and fullscreen board visibility'
          git push
