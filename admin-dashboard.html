<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>Admin Dashboard | NoContext</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.admin-page{min-height:100vh;padding:132px 20px 80px}.admin-shell{max-width:1220px;margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}.kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}.admin-head h1{margin:8px 0 0;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.045em}.admin-badge{display:inline-flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid rgba(190,255,70,.18);border-radius:999px;color:var(--accent);background:rgba(190,255,70,.05);font-size:.76rem}.admin-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:18px}.admin-card{border:1px solid rgba(255,255,255,.09);border-radius:20px;background:rgba(10,10,16,.72);padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.2)}.admin-card h2{margin:0 0 7px;font-size:1.05rem}.admin-card p{color:var(--text-muted);margin:0}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{padding:15px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.02)}.stat strong{display:block;font-size:1.5rem;color:#fff}.stat span{font-size:.72rem;color:var(--text-muted)}.ticket-list{margin-top:18px;display:grid;gap:9px}.ticket-item{width:100%;text-align:left;padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(255,255,255,.02);color:#fff;cursor:pointer}.ticket-item:hover,.ticket-item.active{border-color:rgba(190,255,70,.2);background:rgba(190,255,70,.045)}.ticket-item strong{display:block;margin-bottom:5px}.ticket-item small{color:var(--text-muted)}.status{float:right;text-transform:uppercase;font-size:.62rem;letter-spacing:.1em;color:#9ff0b0}.status.closed{color:#ff9d9d}.admin-users{display:grid;gap:8px;margin-top:18px}.user-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.82rem}.user-row span{color:var(--text-muted)}.detail{min-height:420px}.detail-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--text-muted)}.messages{display:grid;gap:12px;margin:20px 0;max-height:460px;overflow:auto}.message{padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}.message.staff{border-color:rgba(190,255,70,.14)}.message-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:.72rem}.message-head strong{color:#fff}.message-head span{color:var(--text-muted)}.message-body{white-space:pre-wrap;color:#d5dbd8;font-size:.86rem;line-height:1.55}.reply-box{display:flex;gap:10px}.reply-box textarea{flex:1;min-height:90px;resize:vertical;background:#0b0d12;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;padding:12px;font:inherit}.detail-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detail-top h2{margin:0}.admin-error{color:#ff9d9d!important}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07080b;color:#fff;z-index:10000}.hidden{display:none!important}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}.detail{min-height:300px}.stat-grid{grid-template-columns:1fr 1fr}.reply-box{flex-direction:column}}
</style>
</head>
<body>
<div class="loading" data-admin-loading>Verifying owner access…</div>
<nav><div class="container"><a href="index.html" class="logo"><i class="fas fa-cube"></i> NoContext</a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="account-dashboard.html">Dashboard</a></li><li><a href="store.html">Store</a></li><li><a href="contact.html">Contact</a></li></ul></div></nav>
<main class="admin-page"><div class="admin-shell">
<header class="admin-head"><div><div class="kicker">Owner control center</div><h1>Admin Dashboard</h1></div><span class="admin-badge"><i class="fas fa-shield-halved"></i> Owner ID 1</span></header>
<div class="admin-grid">
<section class="admin-card"><h2>Overview</h2><p>Manage NoContext users and support tickets.</p><div class="stat-grid"><div class="stat"><strong data-stat-users>—</strong><span>Users</span></div><div class="stat"><strong data-stat-open>—</strong><span>Open tickets</span></div><div class="stat"><strong data-stat-total>—</strong><span>Total tickets</span></div></div><h2 style="margin-top:28px">Users</h2><div class="admin-users" data-users><p>Loading…</p></div></section>
<section class="admin-card detail"><div class="detail-empty" data-detail-empty><div><i class="fas fa-ticket" style="font-size:2rem;margin-bottom:12px"></i><p>Select a ticket to view the conversation.</p></div></div><div data-ticket-detail class="hidden"></div></section>
</div>
</div></main>
<script>window.NO_CONTEXT_API_URL='https://nocontext.onrender.com';</script>
<script src="assets/js/admin-dashboard.js"></script>
</body></html>
