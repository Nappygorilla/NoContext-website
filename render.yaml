services:
  - type: web
    name: NoContext
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/Nappygorilla/NoContext-website
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: NoContext-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://nappygorilla.github.io
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: LICENSE_TTL_DAYS
        value: "30"

databases:
  - name: NoContext-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
