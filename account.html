<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>License Check | NoContext</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav><div class="container"><a href="index.html" class="logo"><i class="fas fa-cube"></i> NoContext</a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="store.html">Store</a></li><li><a href="key.html">Free Key</a></li></ul></div></nav>
<div class="container"><div class="form-container"><div class="card">
<div class="text-center mb-4"><i class="fas fa-user-shield" style="font-size: 3rem; color: var(--accent);"></i><h2 class="mt-4">License Checker</h2><p>Enter your key to verify its current status.</p></div>
<div class="input-group"><label for="license-key">License Key</label><input type="text" id="license-key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" maxlength="256"></div>
<button class="btn btn-primary" style="width: 100%;" onclick="checkStatus()">Check Status</button>
<div id="status-result" class="mt-4" style="display: none; border-top: 1px solid var(--border); padding-top: 20px;"><div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>Status:</span><span id="status-label" class="font-weight-bold">Unknown</span></div><div style="display: flex; justify-content: space-between;"><span>Expires:</span><span id="expiry-label" style="color: var(--text-muted);">N/A</span></div></div>
<div id="loading-status" class="loading-spinner" style="display: none;"></div>
</div></div></div>
<script src="assets/js/api.js"></script><script src="assets/js/main.js"></script><script src="assets/js/account.js"></script>
</body>
</html>
