<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NoContext</title>
<style>html,body{margin:0;min-height:100%;background:#080a0b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.nc-route-loading{min-height:100vh;display:grid;place-items:center;text-align:center}.nc-route-loading div{padding:28px}.nc-route-loading strong{display:block;font-size:1.1rem}.nc-route-loading span{display:block;margin-top:8px;color:#858c8a;font-size:.85rem}</style>
</head><body>
<div class="nc-route-loading"><div><strong>Loading NoContext…</strong><span>Routing you to the requested page.</span></div></div>
<script>
(async()=>{
const repoBase='/NoContext-website/';
const route=location.pathname.replace(/^\/NoContext-website\/?/,'').replace(/\/$/,'').toLowerCase();
const routes={'':'index.html','index':'index.html','features':'features.html','store':'store.html','browser-games':'browser-games.html','games':'browser-games.html','updates':'updates.html','about':'about.html','faq':'faq.html','contact':'contact.html','privacy':'privacy.html','terms':'terms.html','refunds':'refunds.html','legal':'legal.html','acceptable-use':'acceptable-use.html','copyright':'copyright.html','login':'login.html','register':'register.html','key':'key.html','account':'account-dashboard.html','account-dashboard':'account-dashboard.html','dashboard':'account-dashboard.html','admin':'admin-dashboard.html','admin-dashboard':'admin-dashboard.html','forgot-password':'forgot-password.html','reset-password':'reset-password.html','api':'api.html','developer-api':'developer-api.html','cancel':'cancel.html'};
const target=routes[route]||null;
if(!target){document.body.innerHTML='<div class="nc-route-loading"><div><strong>Page not found</strong><span>The requested NoContext page could not be loaded.</span></div></div>';return;}
try{const response=await fetch(repoBase+target,{cache:'no-store'});if(!response.ok)throw new Error('route');let html=await response.text();if(!/<base\s/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+repoBase+'">');html=html.replace(/(["'`])(?:\.\/|\.\.\/)?([A-Za-z0-9_-]+)\.html([?#][^"'` ]*)?\1/gi,(match,q,name,suffix='')=>{const lower=name.toLowerCase();const mapped=Object.entries(routes).find(([key,value])=>value.toLowerCase()===`${lower}.html`);return q+repoBase+(mapped?mapped[0]:lower)+(suffix||'')+q;});const cleanScript=`<script defer>(()=>{const base='${repoBase}';const cleanPath=p=>{let x=p.replace(/\\/index\\.html$/i,'/').replace(/\\.html$/i,'');return x||'/'};const rewrite=()=>document.querySelectorAll('a[href]').forEach(a=>{const raw=a.getAttribute('href');if(!raw||raw.startsWith('#')||/^(mailto:|tel:|javascript:|data:|blob:)/i.test(raw))return;try{const u=new URL(raw,location.href);if(u.origin!==location.origin||!u.pathname.toLowerCase().endsWith('.html'))return;const rel=u.pathname.startsWith(base)?u.pathname.slice(base.length):'';if(!rel)return;u.pathname=base+cleanPath(rel);a.setAttribute('href',u.pathname+u.search+u.hash)}catch{}});if(location.pathname.toLowerCase().endsWith('.html')){const rel=location.pathname.startsWith(base)?location.pathname.slice(base.length):'';if(rel)history.replaceState(history.state,document.title,base+cleanPath(rel)+location.search+location.hash)}const run=()=>{rewrite();new MutationObserver(rewrite).observe(document.body,{childList:true,subtree:true})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run()})();<\/script>`;html=html.replace(/<\/body>/i,cleanScript+'</body>');document.open();document.write(html);document.close();}catch(error){document.body.innerHTML='<div class="nc-route-loading"><div><strong>Page not found</strong><span>The requested NoContext page could not be loaded.</span></div></div>';}
})();
</script></body></html>
