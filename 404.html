<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoContext</title>
<style>
html,body{margin:0;min-height:100%;background:#080a0b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.nc-route-loading{min-height:100vh;display:grid;place-items:center;text-align:center}.nc-route-loading div{padding:28px}.nc-route-loading strong{display:block;font-size:1.1rem}.nc-route-loading span{display:block;margin-top:8px;color:#858c8a;font-size:.85rem}
</style>
</head>
<body>
<div class="nc-route-loading"><div><strong>Loading NoContext…</strong><span>Routing you to the requested page.</span></div></div>
<script>
(async()=>{
  // GitHub Pages does not provide server-side rewrites. This custom 404 router
  // keeps the public URLs clean while loading the existing static page files.
  const repoBase='/NoContext-website/';
  const route=location.pathname.replace(/^\/NoContext-website\/?/,'').replace(/\/$/,'').toLowerCase();
  const routes={
    '':'index.html','index':'index.html','features':'features.html','store':'store.html',
    'browser-games':'browser-games.html','games':'browser-games.html','updates':'updates.html',
    'about':'about.html','faq':'faq.html','contact':'contact.html','privacy':'privacy.html',
    'terms':'terms.html','login':'login.html','register':'register.html','key':'key.html',
    'account':'account-dashboard.html','account-dashboard':'account-dashboard.html',
    'admin':'admin-dashboard.html','admin-dashboard':'admin-dashboard.html','cancel':'cancel.html'
  };
  const target=routes[route]||null;
  if(!target){
    document.body.innerHTML='<div class="nc-route-loading"><div><strong>Page not found</strong><span>The requested NoContext page could not be loaded.</span></div></div>';
    return;
  }
  try{
    const response=await fetch(repoBase+target,{cache:'no-store'});
    if(!response.ok)throw new Error('route');
    let html=await response.text();
    // Convert every internal .html link to the corresponding clean route.
    html=html.replace(/(["'`])(?:\.\/|\.\.\/)?([A-Za-z0-9_-]+)\.html(#[^"'` ]*)?\1/gi,(match,q,name,hash='')=>{
      const lower=name.toLowerCase();
      const mapped=Object.entries(routes).find(([key,value])=>value.toLowerCase()===`${lower}.html`);
      return q+repoBase+(mapped?mapped[0]:lower)+(hash||'')+q;
    });
    // Root-relative /NoContext-website/... links stay untouched.
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="nc-route-loading"><div><strong>Page not found</strong><span>The requested NoContext page could not be loaded.</span></div></div>';
  }
})();
</script>
</body>
</html>
