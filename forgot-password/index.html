<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070809"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/mobile.css"><title>Forgot Password | luna.win</title><link rel="stylesheet" href="/NoContext-website/assets/css/premium.css?v=20260918"></head><body><main class="auth-page"><section class="auth-card"><div class="auth-brand"><div class="icon">NC</div><h1>Reset password</h1><p>Enter your account email and we'll send a reset link if it exists.</p></div><form id="reset-request" class="auth-form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="320" required></div><button class="btn btn-primary auth-submit" type="submit">Send reset link</button><p class="auth-status" id="status" role="status" aria-live="polite"></p></form><p class="auth-switch"><a href="../login.html">Back to sign in</a></p></section></main><script>window.NO_CONTEXT_API_URL='https://nocontext.onrender.com';</script><script src="../assets/js/pwa.js"></script><script>const f=document.getElementById('reset-request'),s=document.getElementById('status'),b=f.querySelector('button');f.addEventListener('submit',async e=>{e.preventDefault();if(!f.checkValidity())return f.reportValidity();b.disabled=true;b.textContent='Sending…';s.textContent='';try{const r=await fetch(`${window.NO_CONTEXT_API_URL}/api/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Unable to send reset link.');s.textContent=d.message||'If that email belongs to an account, a reset link has been sent.';s.dataset.kind='success';}catch(err){s.textContent=err.message||'Unable to send reset link.';}finally{b.disabled=false;b.textContent='Send reset link';}});</script><script src="/NoContext-website/assets/js/premium-ui.js?v=20260918"></script></body></html>
