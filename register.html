<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="description" content="Create your NoContext account."><meta name="nocontext-api" content="NoContext backend API."><meta name="theme-color" content="#070809"><link rel="preconnect" href="https://nocontext.onrender.com" crossorigin><link rel="dns-prefetch" href="//nocontext.onrender.com"><link rel="manifest" href="manifest.webmanifest"><title>Create Account | NoContext</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:130px 20px 60px}.auth-card{width:min(460px,100%);padding:38px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:rgba(10,10,16,.78);backdrop-filter:blur(22px);box-shadow:0 30px 100px rgba(0,0,0,.5)}.auth-brand{text-align:center;margin-bottom:28px}.auth-brand .icon{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);font-size:1.5rem;box-shadow:0 12px 35px rgba(139,92,246,.28)}.auth-brand h1{margin:0 0 8px}.auth-brand p{margin:0;color:var(--text-muted)}.auth-form{display:grid;gap:16px}.field{display:grid;gap:8px}.field label{font-size:.82rem;font-weight:700;color:#ddd}.field input{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:#fff;outline:none}.field input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}.auth-submit{width:100%;margin-top:4px}.auth-submit:disabled{opacity:.65;cursor:wait}.auth-switch{text-align:center;margin:20px 0 0;color:var(--text-muted);font-size:.9rem}.auth-switch a{color:#c4b5fd;font-weight:700}.terms{text-align:center;color:var(--text-muted);font-size:.72rem;line-height:1.5;margin:15px 0 0}.terms-consent{display:flex;align-items:flex-start;gap:10px;color:var(--text-muted);font-size:.76rem;line-height:1.5}.terms-consent input{width:auto;margin-top:3px;accent-color:#b8ff3d}.terms-consent a{color:#c4b5fd}.auth-status{margin:0;text-align:center;font-size:.82rem;color:#ff9b9b}.auth-status[data-kind="success"]{color:#9ff0b0}@media(max-width:520px){.auth-card{padding:28px 20px}}</style><link rel="stylesheet" href="/NoContext-website/assets/css/premium.css?v=20260917"></head><body><nav><div class="container"><a href="index.html" class="logo"><i class="fas fa-cube"></i> NoContext</a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="features.html">Features</a></li><li><a href="browser-games.html">Browser Games</a></li><li><a href="store.html">Store</a></li><li><a href="about.html">About</a></li><li><a href="updates.html">Updates</a></li><li><a href="faq.html">FAQ</a></li><li><a href="contact.html">Contact</a></li></ul><a href="login.html" class="btn btn-outline">Sign In</a></div></nav><main class="auth-page"><section class="auth-card"><div class="auth-brand"><div class="icon"><i class="fas fa-user-plus"></i></div><h1>Create account</h1><p>Join the NoContext ecosystem.</p></div><form class="auth-form"><div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="text" placeholder="Your username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" maxlength="320" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="12" maxlength="128" required></div><div class="field"><label for="confirm">Confirm Password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Confirm your password" minlength="12" maxlength="128" required></div><label class="terms-consent"><input id="termsConsent" type="checkbox" required><span>I agree to the <a href="terms.html">Terms of Service</a> and acknowledge the <a href="privacy.html">Privacy Policy</a>.</span></label><button class="btn btn-primary auth-submit" type="submit">Create Account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p><p class="terms">Use a unique password. Authentication is handled by the backend; passwords are never stored in the browser.</p></section></main><script>window.NO_CONTEXT_API_URL='https://nocontext.onrender.com';</script><script src="assets/js/main.js?v=20260915"></script><script src="assets/js/pwa.js?v=20260915"></script><script src="assets/js/auth.js?v=20260917"></script><script src="/NoContext-website/assets/js/premium-ui.js?v=20260917"></script></body></html>
